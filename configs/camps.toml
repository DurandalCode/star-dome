# ---------------------------------------------------------------------------
# configs/camps.toml -- named camps: which domes stand where, joined by what.
#
# THIS FILE IS THE SOURCE OF TRUTH FOR SITE LAYOUT.
#
# A dome is described in configs/variants.toml. A camp is not a property of a
# dome, so it does not live there: it is where several of them stand and which
# of their doors face each other.
#
# All positions in millimetres, on the ground plane, x east and y north.
#
# ---------------------------------------------------------------------------
# WHAT IS WRITTEN DOWN AND WHAT IS DERIVED
#
# Written: which domes, at what coordinates, and which pairs are joined.
#
# Derived: the bearing from each dome to its neighbour, the door that bearing
# wants, how far the corridor has to span between the two covers, and where
# its two mouths land. None of those is typed in, because typing a bearing in
# both this file and variants.toml is how the two stop agreeing.
#
# So a link says only what it connects. Move a dome and everything follows.
#
# A dome in a camp carries ONE DOOR PER NEIGHBOUR, pointed at it, and neither
# the count nor the directions are written here: the links already determine
# both. `configs/variants.toml` keeps describing a dome standing on its own.
#
# `turn` is derived too, and is written here only to override it. A door goes
# in a bay and a dome has five of them, 72 degrees apart, so which way it is
# set down decides how near its doors get to its neighbours; the derived turn
# is the one that makes the worst of them the least bad.
#
# Worth knowing before laying one out by eye: a bearing and its reverse differ
# by 180, which is not a multiple of 72, so two domes turned the same way can
# never both have a door on the line between them. One of every joined pair
# comes out turned 36 degrees from the other. Put neighbours at bearings 72
# apart and every corridor lands square; put them anywhere and the plan says
# how far off each door is.
# ---------------------------------------------------------------------------

[camps.yard]
note = "Three domes round a yard: the hall, a kitchen and a store"

[[camps.yard.domes]]
# `name` is the dome's name in this camp, not its variant: a camp can hold
# two of the same size and they still have to be told apart.
name = "hall"
variant = "L"
at = [0, 0]

[[camps.yard.domes]]
name = "kitchen"
variant = "M"
at = [-18895, 12963]

[[camps.yard.domes]]
name = "store"
variant = "S"
at = [4000, -9500]

[[camps.yard.links]]
between = ["hall", "kitchen"]

[[camps.yard.links]]
between = ["hall", "store"]

# A pair of the same size, to check that a camp can hold two of one variant.
[camps.pair]
note = "Two M domes on one corridor, the simplest camp there is"

[[camps.pair.domes]]
name = "east"
variant = "M"
at = [0, 0]

[[camps.pair.domes]]
name = "west"
variant = "M"
at = [10000, 0]

[[camps.pair.links]]
between = ["east", "west"]

# ---------------------------------------------------------------------------
# A tree: one big dome in the middle, and the camp hanging off it.
#
# The hub joins two halls, one hall joins two more domes, and one of those
# joins two small ones. Nobody wrote a door anywhere in here: the hub has two
# neighbours so it gets two doors, the west hall has three so it gets three.
#
# Positions are the two cover radii plus the free run wanted between them --
# about 4 m for the big joins and 3.5 m for the small ones. `stardome camp`
# reports any pair whose covers would touch.
# ---------------------------------------------------------------------------

[camps.tree]
note = "An XL hub, two L halls, two M off one hall and two S off one of those"

[[camps.tree.domes]]
name = "hub"
variant = "XL"
at = [0, 0]

[[camps.tree.domes]]
name = "hall_west"
variant = "L"
at = [-12406, 4031]

[[camps.tree.domes]]
name = "hall_east"
variant = "L"
at = [-7667, -10553]

[[camps.tree.domes]]
name = "kitchen"
variant = "M"
at = [-18895, 12963]

[[camps.tree.domes]]
name = "workshop"
variant = "M"
at = [-22906, 619]

[[camps.tree.domes]]
name = "store_north"
variant = "S"
at = [-18895, 21499]

[[camps.tree.domes]]
name = "store_west"
variant = "S"
at = [-27013, 15601]

[[camps.tree.links]]
between = ["hub", "hall_west"]

[[camps.tree.links]]
between = ["hub", "hall_east"]

[[camps.tree.links]]
between = ["hall_west", "kitchen"]

[[camps.tree.links]]
between = ["hall_west", "workshop"]

[[camps.tree.links]]
between = ["kitchen", "store_north"]

[[camps.tree.links]]
between = ["kitchen", "store_west"]
