# ---------------------------------------------------------------------------
# configs/camps.toml -- named camps: which domes stand where, joined by what.
#
# THIS FILE IS THE SOURCE OF TRUTH FOR SITE LAYOUT.
#
# A dome is described in configs/variants.toml. A camp is not a property of a
# dome, so it does not live there: it is where several of them stand and which
# of their doors face each other.
#
# All positions in millimetres, on the ground plane, x east and y north.
#
# ---------------------------------------------------------------------------
# WHAT IS WRITTEN DOWN AND WHAT IS DERIVED
#
# Written: which domes, at what coordinates, and which pairs are joined.
#
# Derived: the bearing from each dome to its neighbour, the door that bearing
# wants, how far the corridor has to span between the two covers, and where
# its two mouths land. None of those is typed in, because typing a bearing in
# both this file and variants.toml is how the two stop agreeing.
#
# So a link says only what it connects. Move a dome and everything follows.
#
# A dome in a camp carries ONE DOOR PER NEIGHBOUR, pointed at it, and neither
# the count nor the directions are written here: the links already determine
# both. `configs/variants.toml` keeps describing a dome standing on its own.
#
# `turn` is derived too, and is written here only to override it. A door goes
# in a bay and a dome has five of them, 72 degrees apart, so which way it is
# set down decides how near its doors get to its neighbours; the derived turn
# is the one that makes the worst of them the least bad.
#
# Worth knowing before laying one out by eye: a bearing and its reverse differ
# by 180, which is not a multiple of 72, so two domes turned the same way can
# never both have a door on the line between them. One of every joined pair
# comes out turned 36 degrees from the other. Put neighbours at bearings 72
# apart and every corridor lands square; put them anywhere and the plan says
# how far off each door is.
# ---------------------------------------------------------------------------

[camps.yard]
note = "Three domes round a yard: the hall, a kitchen and a store"

[[camps.yard.domes]]
# `name` is the dome's name in this camp, not its variant: a camp can hold
# two of the same size and they still have to be told apart.
name = "hall"
variant = "L"
at = [0, 0]

[[camps.yard.domes]]
name = "kitchen"
variant = "M"
at = [-18895, 12963]

[[camps.yard.domes]]
name = "store"
variant = "S"
at = [4000, -9500]

[[camps.yard.links]]
between = ["hall", "kitchen"]

[[camps.yard.links]]
between = ["hall", "store"]

# A pair of the same size, to check that a camp can hold two of one variant.
[camps.pair]
note = "Two M domes on one corridor, the simplest camp there is"

[[camps.pair.domes]]
name = "east"
variant = "M"
at = [0, 0]

[[camps.pair.domes]]
name = "west"
variant = "M"
at = [10000, 0]

[[camps.pair.links]]
between = ["east", "west"]

# ---------------------------------------------------------------------------
# A tree: one big dome in the middle, and the camp hanging off it.
#
# The hub joins two halls, one hall joins two more domes, and one of those
# joins two small ones. Nobody wrote a door anywhere in here: the hub has two
# neighbours so it gets two doors, the west hall has three so it gets three.
#
# Positions are the two cover radii plus the free run wanted between them --
# about 4 m for the big joins and 3.5 m for the small ones. `stardome camp`
# reports any pair whose covers would touch.
# ---------------------------------------------------------------------------

[camps.tree]
note = "An XL hub, two L halls, two M off one hall and two S off one of those"

[[camps.tree.domes]]
name = "hub"
variant = "XL"
at = [0, 0]

[[camps.tree.domes]]
name = "hall_west"
variant = "L"
at = [-12406, 4031]

[[camps.tree.domes]]
name = "hall_east"
variant = "L"
at = [-7667, -10553]

[[camps.tree.domes]]
name = "kitchen"
variant = "M"
at = [-18895, 12963]

[[camps.tree.domes]]
name = "workshop"
variant = "M"
at = [-22906, 619]

[[camps.tree.domes]]
name = "store_north"
variant = "S"
at = [-18895, 21499]

[[camps.tree.domes]]
name = "store_west"
variant = "S"
at = [-27013, 15601]

[[camps.tree.links]]
between = ["hub", "hall_west"]

[[camps.tree.links]]
between = ["hub", "hall_east"]

[[camps.tree.links]]
between = ["hall_west", "kitchen"]

[[camps.tree.links]]
between = ["hall_west", "workshop"]

[[camps.tree.links]]
between = ["kitchen", "store_north"]

[[camps.tree.links]]
between = ["kitchen", "store_west"]

# ---------------------------------------------------------------------------
# A courtyard: the tree, but the far end closes back on itself.
#
# XL in the middle with an L on either side; one of those L halls carries two
# M, and the two M are joined to each other by a chain of three S. So six of
# the eight domes stand round an open yard and every one of them is reachable
# two ways.
#
# WHY THREE S AND NOT TWO. Turns come out alternating 0 and 36 deg along a
# corridor, which is a two-colouring of the link graph -- and a graph is
# two-colourable only if every cycle in it is even. hall_west - kitchen - S -
# ... - workshop - hall_west is a cycle, so the chain has to make its length
# even. Two S gives a five-corridor ring and one door lands 36 deg out; three
# S gives six, and every door lands square.
#
# The positions are not typed by eye either. Round the ring the angle at each
# dome between its two neighbours has to be a multiple of 72, and the six of
# them have to sum to 720 -- which leaves 72 at the two M and 144 everywhere
# else, and that in turn forces
#
#     L-M  =  S-S  +  0.618 * M-S
#
# on the three edge lengths. Pick the two short ones at two metres of free run
# and the long one follows. `hall_west` also has the hub on it, so the bearing
# to the hub has to be a multiple of 72 from the bearings to both M: 216 deg
# is, 180 is not, which is why the plan is not symmetric about an axis.
# ---------------------------------------------------------------------------

[camps.court]
note = "An XL hub, two L halls, and two M closed into a yard by three S"

[[camps.court.domes]]
name = "hub"
variant = "XL"
at = [0, 0]
# A way in from outside. The hub has two neighbours, so the links give it two
# doors and both of them are a corridor -- there is nothing left to walk in
# through. That is the one door a plan cannot derive, so it is written down.
#
# It cannot be any bearing. A door sits in a bay and there are five of them
# 72 deg apart, so a third door has to be a multiple of 72 from the two the
# corridors already want or the derived turn moves to accommodate it and the
# corridors stop landing square -- asking for 216 swung the hub 18 deg and put
# both its corridor doors 18 deg out. 252 is 144 from one and 216 from the
# other, and it faces away from the camp, where the ground is open.
doors = [252]

[[camps.court.domes]]
name = "hall_west"
variant = "L"
at = [9789, 7112]

[[camps.court.domes]]
name = "hall_east"
variant = "L"
at = [-3739, 11508]

[[camps.court.domes]]
name = "kitchen"
variant = "M"
at = [12997, 16984]

[[camps.court.domes]]
name = "workshop"
variant = "M"
at = [12997, -2761]

[[camps.court.domes]]
name = "store_north"
variant = "S"
at = [18689, 12849]

[[camps.court.domes]]
name = "store_east"
variant = "S"
at = [20553, 7112]

[[camps.court.domes]]
name = "store_south"
variant = "S"
at = [18689, 1375]

[[camps.court.links]]
between = ["hub", "hall_west"]

[[camps.court.links]]
between = ["hub", "hall_east"]

[[camps.court.links]]
between = ["hall_west", "kitchen"]

[[camps.court.links]]
between = ["hall_west", "workshop"]

[[camps.court.links]]
between = ["kitchen", "store_north"]

[[camps.court.links]]
between = ["store_north", "store_east"]

[[camps.court.links]]
between = ["store_east", "store_south"]

[[camps.court.links]]
between = ["store_south", "workshop"]
