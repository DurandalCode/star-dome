# ---------------------------------------------------------------------------
# configs/variants.toml -- named Star Dome variants.
#
# THIS FILE IS THE SOURCE OF TRUTH FOR VARIANT DIMENSIONS.
#
# It is the file to edit when a size or a rod choice changes. Nothing in
# stardome/ contains a variant-specific number.
#
# All dimensions in millimetres (see AGENTS.md).
#
# ---------------------------------------------------------------------------
# ROD DIAMETERS ARE PROVISIONAL -- AND ONE OF THEM IS NOW KNOWN TO BE WRONG
#
# The values below started as engineering *assumptions* rather than results,
# and most of them still are. What has changed is that they have been checked:
# configs/materials.toml, configs/loads.toml and `stardome strength` put a
# modulus, a strength and a wind load behind the arithmetic for the first
# time. See docs/strength.md.
#
# The one hard result: **D3's 8 mm rod cannot be bent to a 1500 mm radius and
# left there.** Held permanently, composite rebar at the minimum GOST 31938
# permits allows 0.224% outer-fibre strain; D3 works its rod at 0.267%. The
# bar is over its creep-rupture limit standing in a dead calm, before any
# wind. It wants 6.7 mm rod, or a bigger dome. D3 has no alias and nobody is
# asked to build it, so the number is left here as the study result it is.
#
# Everything else passes that check -- and the margin GROWS with the dome,
# which is the opposite of what this project assumed. Rod diameter is
# quantised at 8, 10 and 12 mm while the radius halves, so d/2R is worst where
# the dome is smallest.
#
# Still unchecked here: the connectors, the anchors in real soil, and which of
# the two bounding readings of the wind is the true one -- a frame solve, not
# a closed form. The rest of the old warning stands:
#
# Nothing below has been measured against a real coil of rod (milestone 3),
# and the geometric model still says nothing by itself about whether a given
# rod survives being bent to the required radius -- that answer now lives in
# `stardome strength`, not here.
#
# Every bow in this design is bent to a radius equal to the dome radius, so
# the required bend radius scales directly with the variant:
#
#   D4  ->  2000 mm      D8  ->  4000 mm
#   D6  ->  3000 mm      D12 ->  6000 mm
#
# Confirm each against the real rod stock before treating a variant as
# buildable. See docs/roadmap.md milestones 4, 6 and 8.
# ---------------------------------------------------------------------------

[defaults]
# What a caliper reads across the rod, when that is not what the rod is called.
# Zero means the two are the same, which is true of plain round rod.
#
# It will NOT be true of the rod this is most likely to be built from in
# Russia: composite rebar (ГОСТ 31938) is named by its equivalent diameter --
# the one its cross-section area gives -- and carries a winding that stands
# proud of it, so a nominal 10 mm rod measures more across the ribs. Nobody
# has measured one yet; see docs/roadmap.md milestone 3.
#
# The split matters because one number was doing two jobs. This one is the rod
# as an object that has to FIT: channels, rod-on-rod contact at a node, the
# weave's radial spacing, the doorway envelope, the sphere the fabric rests
# on. `rod_diameter` stays the rod as a structural MEMBER: what the fastener
# is sized from, what the splice sleeve is ten of, what bending is judged
# against.
rod_outer_diameter = 0
# Straight segments used to sample one 180 deg bow into a polyline.
rod_segments = 48
# Vertical skirt the dome stands on, mm. Zero for every dome big enough to
# stand up in on its own. See docs/skirt.md.
skirt_height = 0
# Nominal transport section length for the sectional rod concept, mm.
# Joints are placed away from structural crossings; see docs/roadmap.md M5.
section_length = 2400
# Shell spacing for the "layered" drawing convention, as a multiple of rod
# diameter. A drawing convention only -- NOT a build instruction.
weave_gap = 1.0

# ---------------------------------------------------------------------------
# SIZES AND ALIASES
#
# The D-names are the geometric family: one per diameter, nothing else fixed.
# Four of them are also a *chosen build* -- skirt settled, doorway settled --
# and those carry a short alias, which is what a person actually says:
#
#   S = D4     M = D6     L = D8     XL = D10     XXL = D12
#
# Either name loads the same dome. D3 has no alias: it is the bottom end of
# the range, kept for study rather than to build -- 1473 mm of dome is not
# standing height, and decision 0009 records why putting it on a skirt is
# dominated by S.
#
# XXL IS NAMED AND NOT VALIDATED, AND THOSE ARE DIFFERENT THINGS. An alias
# says the BUILD is chosen -- skirt settled, doorway settled -- and D12's is:
# no skirt, a portal in a low bay, the same as M, L and XL. What no size in
# this file carries is a structural check: `stardome span` compares domes to
# each other and assumes the reference is adequate, which is milestones 3
# and 8. XXL is where that assumption is loudest -- equal sag on a 6283 mm
# span asks for 40 mm rod against the 12 mm configured -- so `note` says so,
# and it is the only size whose note has to.
#
# M and L are deliberately bare: no skirt, and therefore no walk-in door.
# `door` on those two records what the dome actually admits rather than what
# anyone would like it to. S keeps its skirt because a 4 m dome with none
# admits nothing at all, not even a crawl.
#
# Where a skirt is present its height is not a preference -- it is the
# shortest that lets the `door` silhouette through, rounded up for about
# 100 mm to spare. See docs/doorway.md. To re-solve one:
#
#     python3 -m stardome doorway <name> --skirt 0 --skirt-for carry
#
# ---------------------------------------------------------------------------
# MORE THAN ONE DOOR
#
# `door` and `door_cut` describe a dome with one door, placed wherever the
# geometry puts the first one. A dome in a camp usually wants more than that,
# and wants them pointing somewhere in particular -- at the yard, at the
# corridor to the next dome -- so how many doors and which way they face is a
# property of the dome, not something the geometry should pick.
#
# Write them out instead, one table per door:
#
#     [[variants.D10.doors]]
#     cut = "portal"      # none | jambs | head | portal
#     facing = 18         # azimuth in degrees
#
#     [[variants.D10.doors]]
#     cut = "none"        # the bay as it stands, nothing removed
#     facing = 198
#     template = "tall"   # optional; defaults to this variant's `door`
#
# `facing` is a wish, not a position. A door can only sit in a bay and there
# are ten, so the nearest eligible one takes it -- low bays for a portal, tall
# bays for everything else -- and the report says where it landed. Two doors
# aimed at the same bay is an error rather than a wider door.
#
# Worth knowing before choosing `cut` on a big dome: past about 8.7 m the
# uncut tall bay already admits everything this project measures, and past
# 9.8 m it takes the 2.2 m character too. On D10 and D12 a cut buys width and
# head height, not admission -- and costs two more part types. See
# docs/span.md and docs/doorway.md.
# ---------------------------------------------------------------------------

[variants.D3]
diameter = 3000
rod_diameter = 8
skirt_height = 1000
note = "small dome on a 1 m skirt; 1473 mm of dome is not standing height on its own"

[variants.D4]
diameter = 4000
rod_diameter = 8
alias = "S"
skirt_height = 1350
door = "carry"
door_cut = "portal"
note = "S -- smallest size with a walk-in door; the skirt is for standing room"

[variants.D6]
diameter = 6000
rod_diameter = 10
alias = "M"
door = "carry"
door_cut = "portal"
note = "M -- reference prototype, bare. Portal door in a low bay: you walk in"

[variants.D8]
diameter = 8000
rod_diameter = 10
alias = "L"
door = "carry"
door_cut = "portal"
note = "L -- large dome, bare. Portal door, and the 2.2 m character gets in"

[variants.D10]
diameter = 10000
rod_diameter = 12
alias = "XL"
door = "carry"
door_cut = "portal"
note = "XL -- walk-in door with no skirt at all; expect D8's reinforcement work"

[variants.D12]
diameter = 12000
rod_diameter = 12
door = "carry"
door_cut = "portal"
alias = "XXL"
note = "XXL -- the top of the range. Bare, portal door, admits everything. 5.9 m tall to erect, and the rod is not shown to carry it: see stardome span D12"
