# ---------------------------------------------------------------------------
# configs/variants.toml -- named Star Dome variants.
#
# THIS FILE IS THE SOURCE OF TRUTH FOR VARIANT DIMENSIONS.
#
# It is the file to edit when a size or a rod choice changes. Nothing in
# stardome/ contains a variant-specific number.
#
# All dimensions in millimetres (see AGENTS.md).
#
# ---------------------------------------------------------------------------
# ROD DIAMETERS ARE PROVISIONAL
#
# The values below are engineering *assumptions*, not results. They are a
# starting point for visual and geometric work only. Nothing here has been
# checked against fiberglass rod properties, buckling, bending stress, minimum
# bend radius, wind load, cover load or anchoring, and the geometric model
# deliberately says nothing about whether a given rod can survive being bent
# to the required radius.
#
# Every bow in this design is bent to a radius equal to the dome radius, so
# the required bend radius scales directly with the variant:
#
#   D4  ->  2000 mm      D8  ->  4000 mm
#   D6  ->  3000 mm      D12 ->  6000 mm
#
# Confirm each against the real rod stock before treating a variant as
# buildable. See docs/roadmap.md milestones 4, 6 and 8.
# ---------------------------------------------------------------------------

[defaults]
# Straight segments used to sample one 180 deg bow into a polyline.
rod_segments = 48
# Vertical skirt the dome stands on, mm. Zero for every dome big enough to
# stand up in on its own. See docs/skirt.md.
skirt_height = 0
# Nominal transport section length for the sectional rod concept, mm.
# Joints are placed away from structural crossings; see docs/roadmap.md M5.
section_length = 2400
# Shell spacing for the "layered" drawing convention, as a multiple of rod
# diameter. A drawing convention only -- NOT a build instruction.
weave_gap = 1.0

[variants.D3]
diameter = 3000
rod_diameter = 8
skirt_height = 1000
note = "small dome on a 1 m skirt; 1473 mm of dome is not standing height on its own"

[variants.D4]
diameter = 4000
rod_diameter = 8
note = "small experimental dome"

[variants.D6]
diameter = 6000
rod_diameter = 10
note = "reference prototype"

[variants.D8]
diameter = 8000
rod_diameter = 10
note = "large dome; expect reinforcement work"

[variants.D10]
diameter = 10000
rod_diameter = 12
note = "large dome; expect the same reinforcement work as D8"

[variants.D12]
diameter = 12000
rod_diameter = 12
note = "XL research variant; explicitly unvalidated"
