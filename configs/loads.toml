# ---------------------------------------------------------------------------
# configs/loads.toml -- what the dome is asked to carry.
#
# THIS FILE IS THE SOURCE OF TRUTH FOR LOADS.
#
# Units: pressure in Pa, speed in m/s, density in kg/m^3, areal mass in g/m^2,
# linear mass in g/m, force in N.
#
# ---------------------------------------------------------------------------
# WIND AND GRAVITY SCREENING
#
# Snow, ponding and occupancy loads are not modelled. The intended temporary
# use does not establish a universal absence of these actions. Add explicit
# cases if the operating scope includes them; no wind result covers them.
#
# `stardome strength --wind V` uses an assumed local peak gust, q=rho*V^2/2.
# Site exposure, terrain, height conversion, reliability factors and design
# load combinations are not supplied. Do not use these diagnostic crossings
# as operational limits. See docs/strength.md and decision 0028.
#
# ---------------------------------------------------------------------------
# THE PRESSURE COEFFICIENTS ARE FOR A SMOOTH HEMISPHERE
#
# A dome with an open doorway, a fabric skin that flogs, and fifteen rods
# standing proud of it is not a wind-tunnel hemisphere. These are the nearest
# published figures and they are an approximation -- one of the named limits
# in docs/strength.md.
# ---------------------------------------------------------------------------

[wind]
# EN 1991-1-4 section 4.5 recommended value.
air_density_kg_m3 = 1.25

# EN 1991-1-4 figure 7.12, cpe,10 for a dome with a circular base sitting on
# the ground: h/d = 0, f/d = 0.5. Reusing these on a raised skirt is an
# unvalidated approximation. Three points
# around the windward-to-leeward arc, interpolated between.
#   A -- windward springing, at ground level facing the wind
#   B -- the crown
#   C -- leeward springing
cp_windward = 0.8
cp_crown = -1.2
cp_lee = -0.4

# Internal pressure. A dome has one dominant opening -- its door -- so which
# way the door faces changes the answer, and the two readings are both here.
#
# Open is a windward dominant-opening scenario. EN 1991-1-4 7.2.9(5)
# uses 0.75 at an opening-area ratio of 2 and 0.90 at 3 or more.
# Use the latter here: 0.90 * 0.8 = 0.72. Actual opening geometry,
# permeability and connected corridors remain unvalidated.
#
# Shut means permeability is unknown, not that pressure is negative.
# Both signs are required by 7.2.9(6), Note 2; evaluate each separately.
cp_internal_open = 0.72
cp_internal_closed = -0.3
cp_internal_closed_positive = 0.2

[weights]
gravity_m_s2 = 9.80665
# Cover fabric. AN ASSUMPTION -- docs/cover.md picks no material at all, and
# this is a lightweight coated polyester, the sort a 55 m^2 cover would be cut
# from if somebody had to carry it. A PVC tarpaulin is 500-650 and would more
# than double the cover's mass.
fabric_g_m2 = 250
# Printed parts. bom.py measures the SOLID volume of each part off its mesh;
# real filament at a normal infill is roughly half of it (docs/bom.md), and
# PETG is 1.27 g/cm^3.
plastic_density_kg_m3 = 1270
infill_fraction = 0.5
# The cover's hardware, from stardome/attachment.py: a bolt rope in the hem
# and five straps over the crown. Both are small, both are counted, and
# neither has been chosen -- these are stock 6 mm polyester rope and 25 mm
# polyester webbing.
hem_rope_g_m = 20
webbing_g_m = 30

[anchors]
# What one driven steel angle holds against being pulled out. THIS IS A SOIL
# QUESTION, NOT A DOME QUESTION, and it is the weakest number in this file:
# pull-out in dry sand and in wet clay differ by more than an order of
# magnitude. 500 N is a placeholder for a 500 mm angle in firm ground, and it
# is here so that the anchor check has something to report rather than
# because anybody measured it.
#
# The printed stake wrap geometry does not establish the soil capacity.
# Measure pull-out, shear and bearing for the selected stake and ground.
capacity_n = 500
# And against being dragged sideways. A bare dome has no tension ring -- its
# ten feet are ten free rod ends with nothing tying them to each other, as
# stardome/model.py says in the skirt code -- so the whole of the drag, plus
# the bows' own outward thrust, arrives at the angles as horizontal shear. A
# driven angle is better in shear than in pull-out, hence the larger figure,
# and it is a placeholder in exactly the same way.
shear_capacity_n = 1200
count = 10
